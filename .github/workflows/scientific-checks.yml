name: Scientific checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run bounded finite checks from the flat artifact root
        shell: bash
        run: |
          set -euo pipefail
          export RAW="$RUNNER_TEMP/p061-science"
          mkdir -p "$RAW"
          timeout --signal=TERM --kill-after=15s 1200s bash -c '
            set -euo pipefail
            ulimit -v 3584000
            ulimit -t 1800
            python -B -m unittest discover -s tests -v 2>&1 | tee "$RAW/unit-tests.log"
            python -B reproduce.py --out "$RAW/first" 2>&1 | tee "$RAW/first.log"
            python -B reproduce.py --out "$RAW/second" 2>&1 | tee "$RAW/second.log"
            python -B verify_results.py --reference "$RAW/first" --candidate "$RAW/second" 2>&1 | tee "$RAW/deterministic-comparison.json"
            python -B replay_inputs.py --reference "$RAW/first" --out "$RAW/input-replay.json" 2>&1 | tee "$RAW/input-replay.log"
            python -B paper_data.py --results "$RAW/first" --out "$RAW/presentation" 2>&1 | tee "$RAW/presentation.log"
          ' 2>&1 | tee "$RAW/whole-run.log"
      - name: Check incidence scheduling against finite independent references
        shell: bash
        run: |
          set -euo pipefail
          export RAW="$RUNNER_TEMP/p061-science"
          mkdir -p "$RAW"
          timeout --signal=TERM --kill-after=5s 30s bash -c '
            set -euo pipefail
            ulimit -v 3584000
            ulimit -t 1800
            python -B -m unittest discover -s tests -p incidence_regression.py -v 2>&1 | tee "$RAW/incidence-regression.log"
          '
      - name: Upload raw outputs even when a scientific gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p061-scientific-outputs
          path: ${{ runner.temp }}/p061-science/
          if-no-files-found: warn
          retention-days: 14
